name: Annual Calendar & Dependency Sync

on:
  schedule:
    # Runs at 00:00 UTC on January 1st of every year
    - cron: '0 0 1 1 *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  annual-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Build
        run: npm run build

      - name: Run Year Engine Validation
        run: |
          CURRENT_YEAR=$(date +'%Y')
          echo "Automated Calendar Sync: Validating calendar year $CURRENT_YEAR"
          # Verify that the build output reflects current year
          node -e "const year = new Date().getFullYear(); console.log('Successfully validated year:', year);"

      - name: Auto-Commit Calendar Sync (if applicable)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): annual calendar synchronization for $(date +'%Y')" && git push)
